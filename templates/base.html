<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Twitter Clone{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="text-xl font-bold text-blue-500">Twitter Clone</a>
      <div class="flex items-center gap-3">
        {% if user.is_authenticated %}
          <div class="w-8 h-8 rounded-full bg-slate-500 flex items-center justify-center text-white text-xs font-bold select-none">
            {{ user.display_name|slice:":2"|upper }}
          </div>
          <span class="text-sm text-gray-700 hidden sm:inline">{{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit"
                    class="text-sm text-gray-500 hover:text-gray-900 transition-colors">
              Logout
            </button>
          </form>
        {% else %}
          <a href="{% url 'login' %}"
             class="text-sm text-gray-600 hover:text-gray-900 transition-colors">
            Login
          </a>
          <a href="{% url 'register' %}"
             class="text-sm bg-blue-500 text-white px-4 py-1.5 rounded-full hover:bg-blue-600 transition-colors">
            Register
          </a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 py-6">
    {% if messages %}
      <div class="mb-4 space-y-2">
        {% for message in messages %}
          <div class="p-3 rounded-lg text-sm
            {% if message.tags == 'error' %}bg-red-100 text-red-700
            {% else %}bg-green-100 text-green-700{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
